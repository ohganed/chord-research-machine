<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chord Research Machine</title><body style="margin:0;background:#0a0c0f;color:white;font-family:-apple-system"><div id="l" style="padding:24px">Loading Chord Research Machine…</div><script>(async()=>{try{const files=['./data1a.txt?v=171','./data1b.txt?v=171','./data2.txt?v=171'];const rs=await Promise.all(files.map(u=>fetch(u,{cache:'no-store'})));if(rs.some(r=>!r.ok))throw new Error('app data unavailable ('+rs.map(r=>r.status).join('/')+')');let b='';for(const r of rs)b+=await r.text();let s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);let t=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('l').innerHTML='<b>Unable to start.</b><br>'+e.message+'<br><br>Please reload this page.'}})()</script></body>
